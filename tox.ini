[tox]
requires = tox-uv>=1
envlist = py{311,312}, quality

[testenv]
runner = uv-venv-lock-runner
dependency_groups = test
commands =
    pytest -rfe --cov=pr_watcher_notifier

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
commands =
    prospector --profile opencraft --uses flask

[flake8]
max-line-length = 120
