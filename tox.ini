[tox]
requires = tox-uv>=1
envlist = py{311,312}, quality

[testenv]
runner = uv-venv-lock-runner
dependency_groups = test
allowlist_externals = make
commands =
    make test

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
allowlist_externals = make
commands =
    make test.quality

[flake8]
max-line-length = 120
