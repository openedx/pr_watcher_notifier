[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pr_watcher_notifier"
dynamic = ["version"]
description = "A Flask web application that sends notifications when watched files change in GitHub pull requests."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Open edX Project", email = "oscm@openedx.org"}]
requires-python = ">=3.11"
classifiers = [
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Flask>=3.1.0",
    "Flask-Mail>=0.10.0",
    "PyGithub>=2.6.1",
    "PyYAML>=6.0.2",
    "gunicorn>=23.0.0",
    "Werkzeug>=3.1.3",
]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["pr_watcher_notifier*"]
exclude = ["*tests*"]

[tool.setuptools.package-data]
"pr_watcher_notifier" = ["templates/**"]

[tool.pytest.ini_options]
# settings.py and test_settings.py live at the repo root, outside src/.
pythonpath = ["."]

[tool.coverage.report]
show_missing = true

[tool.pylint.format]
max-line-length = 120

[dependency-groups]
test = ["pytest", "pytest-cov", "pytest-mock"]
quality = [{include-group = "test"}, "prospector"]
ci = ["tox", "tox-uv>=1"]
dev = [{include-group = "quality"}, {include-group = "ci"}]

[tool.edx_lint]
uv_constraints = []

[tool.uv]
package = true
default-groups = []
#  DO NOT EDIT constraint-dependencies DIRECTLY.
#  This list is managed by `edx_lint write_uv_constraints`
#  and will be overwritten the next time `make upgrade` is run.
#  - GLOBAL constraints: edit edx_lint/files/common_constraints.txt
#  - REPO-SPECIFIC constraints: edit [tool.edx_lint].uv_constraints in this file
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
    "social-auth-app-django<6.0.0",
    "social-auth-core<5.0.0",
    "pip<=26.2.2",
]
